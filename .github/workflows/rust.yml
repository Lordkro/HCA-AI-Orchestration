name: Rust v2

on:
  push:
    branches: ["main"]
    paths: ["crates/**", "docker/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "rustfmt.toml", "clippy.toml", "hca.example.toml", "docker-compose.v2.yml", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "docker/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "rustfmt.toml", "clippy.toml", "hca.example.toml", "docker-compose.v2.yml", ".github/workflows/rust.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel and components; rustup installs them.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: Docs
        run: cargo doc --no-deps --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the sandbox image
        run: docker build -t hca-sandbox -f docker/sandbox.Dockerfile docker
      - name: Test the sandbox against real Docker
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo test --locked -p hca-sandbox -- --ignored
      - name: Build the HCA image
        run: docker build -t hca -f docker/hca.Dockerfile .
      - name: Check the image starts
        run: docker run --rm hca --version
      - name: Validate the Compose file
        run: |
          cp hca.example.toml hca.toml
          docker compose -f docker-compose.v2.yml config --quiet
