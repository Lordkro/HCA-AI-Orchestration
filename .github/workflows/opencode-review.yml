name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Review this pull request against the project conventions in CONTRIBUTING.md:

            Code quality:
            - Must pass `cargo fmt --all -- --check`
            - Must pass `cargo clippy --all-targets -- -D warnings` (pedantic lints are on)
            - Must pass `cargo test --all-targets`; changes to `hca-sandbox` also need
              `cargo test -p hca-sandbox -- --ignored`
            - No `unwrap`/`expect` outside tests; library errors use `thiserror`

            Architecture:
            - Task and project state only changes through `hca-core` events
            - A state change and the job it queues are saved in one store transaction
            - Routing is deterministic code; models never decide where work goes
            - Agent tool mistakes become tool errors, not failed runs
            - Commands only run in the Docker sandbox, never on the host

            Security:
            - API and WebSocket require the access token; no CORS headers
            - Workspace paths stay inside the project (no absolute paths, `..`, `.git/` or symlink escapes)
            - API keys only from environment variables, never from config or logs

            Patterns:
            - Log with `tracing`, not `println!`
            - Role prompts live in `crates/hca-agents/prompts/*.txt`
            - New behavior needs tests; state machine changes keep the property tests in
              `crates/hca-core/tests/termination.rs` passing
            - Docker changes keep the sandbox locked down and the compose port on 127.0.0.1

            Check for bugs, missing error handling, and consistency with existing patterns.
